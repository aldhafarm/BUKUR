# النشر الحيّ: كل دمج إلى main يُختبر ثم يُنشر على https://bukur.mind8x.com
name: النشر على Firebase (main)
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # لا نحتاج git بصلاحيات بعد الجلب
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # سير عمل بأسرار: لا ذاكرة مؤقتة لا نحتاجها (توصية setup-node)
      - run: npm test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUKUR8 }}
          projectId: bukur8
          channelId: live
