<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AL DHAFAR 3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#18181b">
  <meta name="description" content="24-Hour GMT Watch with Awake Time Tracker">
  <title>AL DHAFAR 3</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
    body{overscroll-behavior:none;background:#18181b;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    .safe-top{padding-top:env(safe-area-inset-top)}
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
    input{-webkit-user-select:text;user-select:text}
  </style>
</head>
<body class="bg-zinc-900">
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;

function App(){
  const[time,setTime]=useState(new Date());
  const[bezelRotation,setBezelRotation]=useState(0);
  const[isDragging,setIsDragging]=useState(false);
  const[bezelMode,setBezelMode]=useState('awake');
  const[dialMode,setDialMode]=useState('daynight');
  const[dialNightMode,setDialNightMode]=useState('18-06');
  const[showAwakeProgress,setShowAwakeProgress]=useState(false);
  const[dailyWakeHour,setDailyWakeHour]=useState(5);
  const[dailyWakeMinute,setDailyWakeMinute]=useState(0);
  const[nightGradientMode,setNightGradientMode]=useState('radial');
  const[showSettings,setShowSettings]=useState(false);
  const svgRef=useRef(null);
  const lastAngleRef=useRef(0);

  useEffect(()=>{
    const timer=setInterval(()=>setTime(new Date()),1000);
    return()=>clearInterval(timer);
  },[]);

  useEffect(()=>{
    try{
      const saved=localStorage.getItem('aldhafar3');
      if(saved){
        const s=JSON.parse(saved);
        if(s.bezelRotation!==undefined)setBezelRotation(s.bezelRotation);
        if(s.dialMode)setDialMode(s.dialMode);
        if(s.dialNightMode)setDialNightMode(s.dialNightMode);
        if(s.nightGradientMode)setNightGradientMode(s.nightGradientMode);
        if(s.dailyWakeHour!==undefined)setDailyWakeHour(s.dailyWakeHour);
        if(s.dailyWakeMinute!==undefined)setDailyWakeMinute(s.dailyWakeMinute);
      }
    }catch(e){}
  },[]);

  useEffect(()=>{
    localStorage.setItem('aldhafar3',JSON.stringify({
      bezelRotation,dialMode,dialNightMode,nightGradientMode,dailyWakeHour,dailyWakeMinute
    }));
  },[bezelRotation,dialMode,dialNightMode,nightGradientMode,dailyWakeHour,dailyWakeMinute]);

  const hours=time.getHours();
  const minutes=time.getMinutes();
  const seconds=time.getSeconds();
  const date=time.getDate();

  const currentHourDegrees=(hours*15)+(minutes*0.25);
  let wakeTimeHour=bezelRotation/15+0.5;
  while(wakeTimeHour<0)wakeTimeHour+=24;
  while(wakeTimeHour>=24)wakeTimeHour-=24;
  let hoursAwake=(currentHourDegrees-bezelRotation)/15-0.5;
  while(hoursAwake<0)hoursAwake+=24;
  while(hoursAwake>=24)hoursAwake-=24;

  const hourDegrees=(hours*15)+(minutes*0.25);
  const minuteDegrees=(minutes*6)+(seconds*0.1);
  const secondDegrees=seconds*6;
  const hourDegreesOffset=hourDegrees-180;

  const formatTime=(d)=>{
    const h=Math.floor(d);
    const m=Math.floor((d-h)*60);
    return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
  };

  const formatDuration=(h)=>{
    const hrs=Math.floor(h);
    const mins=Math.round((h-hrs)*60);
    return mins===0?`${hrs}h`:`${hrs}h ${mins}m`;
  };

  const getStatus=()=>{
    if(hoursAwake<12)return{s:'Fresh',c:'text-green-400',e:'😊'};
    if(hoursAwake<16)return{s:'Active',c:'text-yellow-400',e:'😐'};
    if(hoursAwake<20)return{s:'Tired',c:'text-orange-400',e:'😴'};
    return{s:'Sleep!',c:'text-red-400',e:'🛏️'};
  };
  const status=getStatus();

  const setWakeUpNow=()=>{
    const deg=(hours*15)+(minutes*0.25);
    setBezelRotation((deg-7.5+360)%360);
  };

  const setWakeFromInput=()=>{
    const deg=(dailyWakeHour*15)+(dailyWakeMinute*0.25);
    setBezelRotation((deg-7.5+360)%360);
  };

  const handlePointerDown=(e)=>{
    e.preventDefault();
    setIsDragging(true);
    const rect=svgRef.current.getBoundingClientRect();
    const cx=rect.left+rect.width/2;
    const cy=rect.top+rect.height/2;
    const clientX=e.touches?e.touches[0].clientX:e.clientX;
    const clientY=e.touches?e.touches[0].clientY:e.clientY;
    lastAngleRef.current=Math.atan2(clientY-cy,clientX-cx)*180/Math.PI;
  };

  useEffect(()=>{
    const move=(e)=>{
      if(!isDragging||!svgRef.current)return;
      const rect=svgRef.current.getBoundingClientRect();
      const cx=rect.left+rect.width/2;
      const cy=rect.top+rect.height/2;
      const clientX=e.touches?e.touches[0].clientX:e.clientX;
      const clientY=e.touches?e.touches[0].clientY:e.clientY;
      const angle=Math.atan2(clientY-cy,clientX-cx)*180/Math.PI;
      let delta=angle-lastAngleRef.current;
      if(delta>180)delta-=360;
      if(delta<-180)delta+=360;
      setBezelRotation(p=>(p+delta+360)%360);
      lastAngleRef.current=angle;
    };
    const up=()=>setIsDragging(false);
    if(isDragging){
      window.addEventListener('mousemove',move);
      window.addEventListener('mouseup',up);
      window.addEventListener('touchmove',move,{passive:false});
      window.addEventListener('touchend',up);
    }
    return()=>{
      window.removeEventListener('mousemove',move);
      window.removeEventListener('mouseup',up);
      window.removeEventListener('touchmove',move);
      window.removeEventListener('touchend',up);
    };
  },[isDragging]);

  const renderBezel=()=>{
    const segs=[];
    const outerR=195,innerR=160;
    for(let i=0;i<23;i++){
      const hour=i+1;
      const startAngle=(i*15)-255;
      const endAngle=((i+1)*15)-255;
      const startRad=startAngle*Math.PI/180;
      const endRad=endAngle*Math.PI/180;
      let bgColor,textColor;
      if(showAwakeProgress){
        bgColor=hour<=Math.floor(hoursAwake)?'#888':'#000';
        textColor='#FFF';
      }else if(bezelMode==='daynight'){
        if(hour>=6&&hour<18){bgColor='#FFF';textColor='#000';}
        else{bgColor='#666';textColor='#FFF';}
      }else{bgColor='#000';textColor='#FFF';}
      const x1=200+outerR*Math.cos(startRad),y1=200+outerR*Math.sin(startRad);
      const x2=200+outerR*Math.cos(endRad),y2=200+outerR*Math.sin(endRad);
      const x3=200+innerR*Math.cos(endRad),y3=200+innerR*Math.sin(endRad);
      const x4=200+innerR*Math.cos(startRad),y4=200+innerR*Math.sin(startRad);
      segs.push(<path key={`s${i}`} d={`M${x1} ${y1}A${outerR} ${outerR} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${innerR} ${innerR} 0 0 0 ${x4} ${y4}Z`} fill={bgColor} stroke="#333" strokeWidth="0.5"/>);
      const labelAngle=((i+0.5)*15)-255;
      const labelRad=labelAngle*Math.PI/180;
      const lx=200+177*Math.cos(labelRad),ly=200+177*Math.sin(labelRad);
      segs.push(<text key={`l${i}`} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="11" fontWeight="700" fill={textColor} style={{fontFamily:'Arial'}} transform={`rotate(${labelAngle+90},${lx},${ly})`}>{hour.toString().padStart(2,'0')}</text>);
    }
    const redAngle=(-255-7.5)*Math.PI/180;
    const perpAngle=redAngle+Math.PI/2;
    const tipX=200+innerR*Math.cos(redAngle),tipY=200+innerR*Math.sin(redAngle);
    const baseX=200+(outerR-5)*Math.cos(redAngle),baseY=200+(outerR-5)*Math.sin(redAngle);
    const leftX=baseX+8*Math.cos(perpAngle),leftY=baseY+8*Math.sin(perpAngle);
    const rightX=baseX-8*Math.cos(perpAngle),rightY=baseY-8*Math.sin(perpAngle);
    segs.push(<polygon key="tri" points={`${tipX},${tipY} ${leftX},${leftY} ${rightX},${rightY}`} fill="#C41E3A"/>);
    return segs;
  };

  const hourAngle=((hours*15)+(minutes*0.25)-90)*Math.PI/180;
  const gradCx=50+50*Math.cos(hourAngle);
  const gradCy=50+50*Math.sin(hourAngle);

  return(
    <div className="flex flex-col items-center h-screen bg-zinc-900 text-white safe-top safe-bottom overflow-auto">
      <div className="text-center pt-2">
        <h1 className="text-lg font-bold text-amber-400">AL DHAFAR 3</h1>
      </div>
      <div className="text-center">
        <p className="text-3xl font-mono font-bold">
          {hours.toString().padStart(2,'0')}:{minutes.toString().padStart(2,'0')}
          <span className="text-base text-zinc-500">:{seconds.toString().padStart(2,'0')}</span>
        </p>
      </div>
      <div className="flex gap-3 my-2 text-center">
        <div className="bg-zinc-800 px-3 py-1 rounded-lg">
          <p className="text-xs text-zinc-500">Wake</p>
          <p className="text-base font-mono font-bold">{formatTime(wakeTimeHour)}</p>
        </div>
        <div className="bg-zinc-800 px-3 py-1 rounded-lg">
          <p className="text-xs text-zinc-500">Awake</p>
          <p className={`text-base font-bold ${status.c}`}>{formatDuration(hoursAwake)}</p>
        </div>
        <div className="bg-zinc-800 px-3 py-1 rounded-lg">
          <p className="text-xs text-zinc-500">Status</p>
          <p className={`text-base font-bold ${status.c}`}>{status.e}</p>
        </div>
      </div>
      <div className="w-64 mb-2">
        <div className="h-2 bg-zinc-800 rounded-full overflow-hidden">
          <div className={`h-full transition-all ${hoursAwake<12?'bg-green-500':hoursAwake<16?'bg-yellow-500':hoursAwake<20?'bg-orange-500':'bg-red-500'}`} style={{width:`${Math.min((hoursAwake/24)*100,100)}%`}}/>
        </div>
      </div>
      <svg ref={svgRef} width="300" height="300" viewBox="0 0 400 400" onMouseDown={handlePointerDown} onTouchStart={handlePointerDown} style={{cursor:isDragging?'grabbing':'grab',touchAction:'none'}}>
        <defs>
          <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" floodOpacity="0.5"/></filter>
          <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#F0F0F0"/><stop offset="50%" stopColor="#C8C8C8"/><stop offset="100%" stopColor="#A0A0A0"/></linearGradient>
          <clipPath id="dialClip"><circle cx="200" cy="200" r="155"/></clipPath>
          <radialGradient id="nightRadial" cx={`${gradCx}%`} cy={`${gradCy}%`} r="100%" fx={`${gradCx}%`} fy={`${gradCy}%`}><stop offset="0%" stopColor="#000"/><stop offset="30%" stopColor="#111"/><stop offset="60%" stopColor="#333"/><stop offset="100%" stopColor="#555"/></radialGradient>
          <linearGradient id="nightLinear" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stopColor="#555"/><stop offset="50%" stopColor="#222"/><stop offset="100%" stopColor="#000"/></linearGradient>
        </defs>
        <circle cx="200" cy="200" r="198" fill="url(#caseGrad)" filter="url(#shadow)"/>
        <g transform={`rotate(${bezelRotation},200,200)`}>
          <circle cx="200" cy="200" r="195" fill="#666" stroke="#333" strokeWidth="2"/>
          {renderBezel()}
        </g>
        {dialMode==='white'?<circle cx="200" cy="200" r="155" fill="#FAFAFA" stroke="#DDD" strokeWidth="2"/>:(
          <><g clipPath="url(#dialClip)">
            <circle cx="200" cy="200" r="155" fill="#FAFAFA"/>
            {(()=>{
              let ns=dialNightMode==='19-05'?19:18,ne=dialNightMode==='19-05'?5:6;
              const sa=((ns-12)*15)-90,ea=((ne-12)*15)-90;
              const sr=sa*Math.PI/180,er=ea*Math.PI/180;
              const x1=200+160*Math.cos(sr),y1=200+160*Math.sin(sr);
              const x2=200+160*Math.cos(er),y2=200+160*Math.sin(er);
              return<path d={`M200 200L${x1} ${y1}A160 160 0 1 1 ${x2} ${y2}Z`} fill={`url(#${nightGradientMode==='radial'?'nightRadial':'nightLinear'})`}/>;
            })()}
          </g><circle cx="200" cy="200" r="155" fill="none" stroke="#DDD" strokeWidth="2"/></>
        )}
        {[4,8,12,16,20,0].map(h=>{
          const a=(h*15)-270,r=a*Math.PI/180;
          const x=200+140*Math.cos(r),y=200+140*Math.sin(r);
          const dh=h===0?24:h;
          let isNight=dialNightMode==='19-05'?(dh>=19||dh<5):(dh>=18||dh<6);
          const tc=dialMode==='daynight'?(isNight?'#FFF':'#111'):'#111';
          return<text key={h} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="20" fontWeight="700" fill={tc} style={{fontFamily:'Arial'}}>{h.toString().padStart(2,'0')}</text>;
        })}
        <text x="200" y="100" textAnchor="middle" fontSize="9" fontWeight="600" fill="#333" style={{fontFamily:'Arial',letterSpacing:'2px'}}>AL DHAFAR 3</text>
        <rect x="187" y="268" width="26" height="18" fill="#FFF" stroke="#333" strokeWidth="1.5" rx="2"/>
        <text x="200" y="281" textAnchor="middle" fontSize="12" fontWeight="700" fill="#111" style={{fontFamily:'Arial'}}>{date}</text>
        <g transform={`rotate(${hourDegreesOffset},200,200)`}>
          <path d="M194,200 L197,100 L200,70 L203,100 L206,200 Z" fill="#C41E3A" stroke="#8B0000" strokeWidth="0.5"/>
          <path d="M196,200 L198,230 L200,245 L202,230 L204,200 Z" fill="#C41E3A" stroke="#8B0000" strokeWidth="0.5"/>
        </g>
        <g transform={`rotate(${minuteDegrees},200,200)`}>
          <path d="M196,200 L198,160 L200,135 L202,160 L204,200 Z" fill="#C41E3A" stroke="#8B0000" strokeWidth="0.5"/>
        </g>
        <g transform={`rotate(${secondDegrees},200,200)`}>
          <line x1="200" y1="130" x2="200" y2="160" stroke="#C41E3A" strokeWidth="2"/>
          <line x1="200" y1="160" x2="200" y2="225" stroke="#C41E3A" strokeWidth="2"/>
          <circle cx="200" cy="225" r="5" fill="#C41E3A"/>
        </g>
        <circle cx="200" cy="200" r="10" fill="#C41E3A"/>
        <circle cx="200" cy="200" r="4" fill="#8B0000"/>
      </svg>
      <div className="flex gap-2 mt-2">
        <button onClick={setWakeUpNow} className="px-4 py-2 bg-green-600 active:bg-green-700 text-white rounded-lg text-sm font-semibold">☀️ Woke Up</button>
        <button onClick={()=>setBezelRotation(0)} className="px-4 py-2 bg-zinc-700 active:bg-zinc-800 text-white rounded-lg text-sm">Reset</button>
        <button onClick={()=>setShowSettings(!showSettings)} className={`px-4 py-2 rounded-lg text-sm ${showSettings?'bg-amber-600':'bg-zinc-700'} text-white`}>⚙️</button>
      </div>
      <div className="flex items-center gap-2 bg-zinc-800 p-2 rounded-lg mt-2">
        <span className="text-xs text-zinc-400">Wake:</span>
        <input type="number" min="0" max="23" value={dailyWakeHour} onChange={e=>setDailyWakeHour(Math.min(23,Math.max(0,parseInt(e.target.value)||0)))} className="w-10 px-1 py-1 bg-zinc-700 text-white text-center rounded text-sm"/>
        <span>:</span>
        <input type="number" min="0" max="59" step="5" value={dailyWakeMinute.toString().padStart(2,'0')} onChange={e=>setDailyWakeMinute(Math.min(59,Math.max(0,parseInt(e.target.value)||0)))} className="w-10 px-1 py-1 bg-zinc-700 text-white text-center rounded text-sm"/>
        <button onClick={setWakeFromInput} className="px-3 py-1 bg-amber-600 text-white rounded text-sm">Set</button>
      </div>
      {showSettings&&(
        <div className="bg-zinc-800 p-3 rounded-lg w-72 mt-2 text-sm">
          <div className="flex justify-between items-center mb-2">
            <span className="text-zinc-400">Dial</span>
            <div className="flex gap-1">
              <button onClick={()=>setDialMode('white')} className={`px-2 py-1 rounded text-xs ${dialMode==='white'?'bg-amber-600':'bg-zinc-700'}`}>White</button>
              <button onClick={()=>setDialMode('daynight')} className={`px-2 py-1 rounded text-xs ${dialMode==='daynight'?'bg-amber-600':'bg-zinc-700'}`}>Day/Night</button>
            </div>
          </div>
          {dialMode==='daynight'&&(<>
            <div className="flex justify-between items-center mb-2">
              <span className="text-zinc-400">Night</span>
              <div className="flex gap-1">
                <button onClick={()=>setDialNightMode('18-06')} className={`px-2 py-1 rounded text-xs ${dialNightMode==='18-06'?'bg-purple-600':'bg-zinc-700'}`}>18-06</button>
                <button onClick={()=>setDialNightMode('19-05')} className={`px-2 py-1 rounded text-xs ${dialNightMode==='19-05'?'bg-purple-600':'bg-zinc-700'}`}>19-05</button>
              </div>
            </div>
            <div className="flex justify-between items-center mb-2">
              <span className="text-zinc-400">Gradient</span>
              <div className="flex gap-1">
                <button onClick={()=>setNightGradientMode('linear')} className={`px-2 py-1 rounded text-xs ${nightGradientMode==='linear'?'bg-indigo-600':'bg-zinc-700'}`}>Static</button>
                <button onClick={()=>setNightGradientMode('radial')} className={`px-2 py-1 rounded text-xs ${nightGradientMode==='radial'?'bg-indigo-600':'bg-zinc-700'}`}>Follow</button>
              </div>
            </div>
          </>)}
          <div className="flex justify-between items-center mb-2">
            <span className="text-zinc-400">Bezel</span>
            <div className="flex gap-1">
              <button onClick={()=>setBezelMode('awake')} className={`px-2 py-1 rounded text-xs ${bezelMode==='awake'?'bg-amber-600':'bg-zinc-700'}`}>Awake</button>
              <button onClick={()=>setBezelMode('daynight')} className={`px-2 py-1 rounded text-xs ${bezelMode==='daynight'?'bg-amber-600':'bg-zinc-700'}`}>Day/Night</button>
            </div>
          </div>
          <div className="flex justify-between items-center">
            <span className="text-zinc-400">Progress</span>
            <button onClick={()=>setShowAwakeProgress(!showAwakeProgress)} className={`px-2 py-1 rounded text-xs ${showAwakeProgress?'bg-green-600':'bg-zinc-700'}`}>{showAwakeProgress?'ON':'OFF'}</button>
          </div>
        </div>
      )}
      <p className="text-xs text-zinc-600 mt-2 pb-4">Drag bezel • Tap ☀️ when awake</p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
