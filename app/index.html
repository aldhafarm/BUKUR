<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123524">
  <meta name="description" content="البُكور — أدواتك في مكان واحد">
  <title>البُكور</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>البُكور</h1>
    <div class="top-actions">
      <button type="button" id="tools" aria-expanded="false" aria-controls="menu">أدواتي</button>

  </header>
  <div id="menu" class="menu" hidden>
    <p>أظهر أو أخفِ الأدوات:</p>
    <ul></ul>
    <div class="menu-actions">
      <button type="button" id="export">تصدير نسخة احتياطية</button>
      <label class="file-btn">استيراد<input type="file" id="import" accept="application/json" hidden></label>
    </div>
  </div>
  <main id="board" class="board"></main>
  <p id="empty" class="empty" hidden>كل الأدوات مخفية — أظهرها من «أدواتي».</p>
  <script type="module" src="host.js"></script>
